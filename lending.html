<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lending Radar — Macro Credit Radar</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--ok:#15803d;--okb:#dcfce7;--ca:#b45309;--cab:#fef3c7;--av:#b91c1c;--avb:#fee2e2;--un:#475569;--unb:#e2e8f0;--acc:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.pick{display:grid;gap:10px;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
@media(min-width:640px){.pick{grid-template-columns:1fr 1fr 1.4fr}}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
select,input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:46px}
select:focus,input:focus{outline:2px solid var(--acc);border-color:transparent}
.cb{position:relative}.lb{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;z-index:20;box-shadow:0 12px 30px #0f172a22;display:none}
.lb.open{display:block}.lb div{padding:9px 12px;cursor:pointer;font-size:14px}.lb div:hover,.lb div.act{background:#eff6ff}.lb .g{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;cursor:default;background:#f8fafc}.lb .hub::after{content:" · local hub";color:var(--acc);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 2px #0f172a0d}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{font-weight:750;font-size:15px;padding:7px 14px;border-radius:999px}.ok{background:var(--okb);color:var(--ok)}.caution{background:var(--cab);color:var(--ca)}.avoid{background:var(--avb);color:var(--av)}.unknown{background:var(--unb);color:var(--un)}
.score{font-size:28px;font-weight:750}.score small{font-size:13px;color:var(--mut);font-weight:500}
.head{font-size:17px;font-weight:600;margin:10px 0 4px}.meta{color:var(--mut);font-size:12.5px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:18px 0 6px}
ul,ol{margin:0;padding-left:20px}li{margin:4px 0}a{color:var(--acc)}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0;font-weight:600}
.proxy{background:#fff7ed;color:#9a3412}.note{background:#f8fafc;border-left:3px solid var(--line);padding:8px 10px;border-radius:6px;font-size:13.5px;color:#334155;margin-top:8px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.spark{display:flex;align-items:flex-end;gap:3px;height:46px;margin:6px 0}.spark i{flex:1;background:#93c5fd;border-radius:3px 3px 0 0;position:relative}.spark i.neg{background:#fca5a5}
.foot{color:var(--mut);font-size:12px;margin-top:18px}.empty{color:var(--mut);text-align:center;padding:30px 10px}
.v5{background:linear-gradient(160deg,#0f172a,#1e293b);color:#e2e8f0;border:0;border-radius:22px;padding:22px 18px;box-shadow:0 12px 32px #0f172a40;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.v5 .vp{display:inline-flex;align-items:center;gap:10px;background:#f59e0b;color:#1c1203;font-weight:800;font-size:20px;padding:10px 18px;border-radius:999px}.v5 .vp b{font-size:26px}.v5 .vp small{font-weight:600;font-size:13px;opacity:.8}
.v5 .tag{font-size:11px;color:#67e8f9;border:1px solid #155e75;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.v5 .call{font-size:19px;line-height:1.4;font-weight:650;color:#fff;margin:16px 0 6px}.v5 .sn{font-size:13px;color:#94a3b8}
.v5 h4{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#94a3b8;margin:22px 0 10px}
.v5 .tiles{display:grid;gap:10px;grid-template-columns:1fr}@media(min-width:640px){.v5 .tiles{grid-template-columns:repeat(3,1fr)}.v5 .cols{grid-template-columns:1fr 1fr}}
.v5 .tile{background:#ffffff0d;border:1px solid #ffffff14;border-radius:16px;padding:14px}.v5 .ti{font-size:22px}.v5 .tn{font-size:20px;font-weight:750;color:#fca5a5;margin:4px 0}.v5 .tt{font-weight:600;color:#f1f5f9}.v5 .ts{font-size:12.5px;color:#94a3b8;margin-top:4px}
.v5 .cols{display:grid;gap:10px}.v5 .col{border-radius:16px;padding:14px}.v5 .bk{background:#14532d55;border:1px solid #16653480}.v5 .av{background:#7f1d1d55;border:1px solid #991b1b80}
.v5 .col h5{margin:0 0 8px;font-size:14px}.v5 .bk h5{color:#86efac}.v5 .av h5{color:#fca5a5}.v5 .col li{font-size:14px;margin:6px 0;color:#e2e8f0}
.v5 .fn{font-size:12px;color:#94a3b8;margin-top:8px;font-style:italic}
.v5 .ew{background:#ffffff0d;border-left:3px solid #f59e0b;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}.v5 .ew b{color:#fde68a}
.v5 a{color:#7dd3fc}.v5 details{border-top:1px solid #ffffff1a}.v5 summary{color:#cbd5e1}.v5 table td,.v5 table th{border-color:#ffffff1a;color:#cbd5e1}.v5 .meta{color:#94a3b8}.v5 sup a{font-size:11px;text-decoration:none}
</style></head><body>
<main>
<h1>Lending Radar</h1><p class="sub">Pick a place and an industry for a quick, data-backed stance. Decision aid, not a substitute for credit judgment. Internal use only.</p>
<div class="pick">
 <div><label for="st">State</label><select id="st"></select></div>
 <div><label for="ct">City</label><select id="ct"></select></div>
 <div class="cb"><label for="ind">Industry</label><input id="ind" placeholder="Search industry…" autocomplete="off" role="combobox" aria-expanded="false"><div class="lb" id="lb" role="listbox"></div></div>
</div>
<div id="result"><div class="card empty">Loading…</div></div>
<p class="foot" id="foot"></p>
</main>
<script src="assets/nav.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LBL={ok:'OK to lend',caution:'Caution',avoid:'Avoid'};let D,V5={},V4={},B={},IND={},CITY={},sel={st:'',ct:'',ind:''};
const qp=new URLSearchParams(location.search);
Promise.all([fetch('data/radar.json').then(r=>r.json()),fetch('data/radar_briefs.json').then(r=>r.ok?r.json():{}).catch(()=>({})),fetch('data/v4_test.json?'+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,b,v])=>{D=d;B=b;V4=(v&&v.cards)||{};fetch('data/v5_morbi.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>{if(x)V5[x.key]=x;init()})});
function init(){D.industries.forEach(i=>IND[i.id]=i);D.cities.forEach(c=>CITY[c.id]=c);
 const sts=Object.entries(D.states).filter(([k])=>D.cities.some(c=>c.state==k)).sort((a,b)=>a[1].name.localeCompare(b[1].name));
 $('#st').innerHTML=sts.map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');
 sel.st=qp.get('state')&&D.states[qp.get('state')]?qp.get('state'):'GJ';$('#st').value=sel.st;fillCities(qp.get('city'));
 sel.ind=IND[qp.get('ind')]?qp.get('ind'):(CITY[sel.ct]?.hubs[0]||'');$('#ind').value=IND[sel.ind]?.name||'';
 $('#st').onchange=()=>{sel.st=$('#st').value;fillCities();if(!CITY[sel.ct]?.hubs.includes(sel.ind)){}render()};
 $('#ct').onchange=()=>{sel.ct=$('#ct').value;render()};
 const inp=$('#ind'),lb=$('#lb');let act=-1;
 const list=()=>{const q=inp.value.toLowerCase().trim(),hubs=sel.ct?CITY[sel.ct].hubs:[];const m=D.industries.filter(i=>!q||(i.name+' '+i.group+' '+(i.nic||'')).toLowerCase().includes(q)||(IND[sel.ind]&&inp.value==IND[sel.ind].name));
  const hub=m.filter(i=>hubs.includes(i.id)),rest=m.filter(i=>!hubs.includes(i.id));let h='';
  if(hub.length)h+=`<div class="g">Known hubs in ${esc(CITY[sel.ct].name)}</div>`+hub.map(i=>`<div data-id="${i.id}" class="hub" role="option">${esc(i.name)}</div>`).join('');
  const gs=[...new Set(rest.map(i=>i.group))];gs.forEach(g=>{h+=`<div class="g">${esc(g)}</div>`+rest.filter(i=>i.group==g).map(i=>`<div data-id="${i.id}" role="option">${esc(i.name)}</div>`).join('')});
  lb.innerHTML=h||'<div class="g">No match</div>';lb.classList.add('open');inp.setAttribute('aria-expanded','true');act=-1};
 inp.onfocus=()=>{inp.select();list()};inp.oninput=list;
 inp.onkeydown=e=>{const o=[...lb.querySelectorAll('[data-id]')];if(e.key=='ArrowDown'||e.key=='ArrowUp'){act=Math.max(0,Math.min(o.length-1,act+(e.key=='ArrowDown'?1:-1)));o.forEach((x,i)=>x.classList.toggle('act',i==act));o[act]?.scrollIntoView({block:'nearest'});e.preventDefault()}if(e.key=='Enter'&&o[Math.max(act,0)]){pick(o[Math.max(act,0)].dataset.id)}if(e.key=='Escape')close()};
 lb.onmousedown=e=>{const t=e.target.closest('[data-id]');if(t){e.preventDefault();pick(t.dataset.id)}};
 inp.onblur=()=>setTimeout(close,120);
 function pick(id){sel.ind=id;inp.value=IND[id].name;close();inp.blur();render()}
 function close(){lb.classList.remove('open');inp.setAttribute('aria-expanded','false');if(IND[sel.ind])inp.value=IND[sel.ind].name}
 $('#foot').innerHTML=`Data refreshed ${esc(D.generated_at_ist)} · FY ${esc(D.fy)} · ${esc(D.units)} · ${D.industries.length} industries · ${D.cities.length} cities. ${esc(D.disclaimer)} Verdicts use only verified official figures; local news can only turn OK to lend into Caution. See <a href="methodology.html">methodology</a> and <a href="audit.html">data audit</a>.`;
 render()}
function fillCities(want){const cs=D.cities.filter(c=>c.state==sel.st).sort((a,b)=>a.name.localeCompare(b.name));$('#ct').innerHTML=cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');sel.ct=cs.find(c=>c.id==want)?want:(cs[0]?.id||'');$('#ct').value=sel.ct}
const mon=iso=>{if(!iso)return'';const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[+iso.slice(5,7)-1]+'-'+iso.slice(0,4)};
function spark(pts,key,lab){if(!pts||pts.length<2)return'';const v=pts.map(p=>p[key]),mx=Math.max(...v.map(Math.abs),1);return `<div class="spark" aria-label="${esc(lab)}">${pts.map(p=>`<i class="${p[key]<0?'neg':''}" style="height:${Math.max(6,Math.abs(p[key])/mx*100)}%" title="${esc(p.period)}: ${p[key]}%"></i>`).join('')}</div><div class="meta">${pts.map(p=>esc(p.period)+' '+p[key]+'%').join(' · ')}</div>`}


function v5html(x,ind,ct){const sup=a=>(a||[]).map(i=>`<sup><a href="${esc(x.articles[i].url)}" target="_blank" rel="noopener">[${i+1}]</a></sup>`).join('');
 const arr={up:'▲',down:'▼',flat:'▬'},m=V4[x.key]&&V4[x.key].market,f=v=>(v>0?'+':'')+v+'%';
 const mt=m?`<table><tr><th>Share</th><th>1M</th><th>3M</th><th>12M</th></tr><tr><td><b>Nifty 50</b></td><td>${f(m.nifty.r1m)}</td><td>${f(m.nifty.r3m)}</td><td>${f(m.nifty.r12m)}</td></tr>${Object.entries(m.peers).map(([k,p])=>`<tr><td>${esc(k)}</td><td>${f(p.r1m)}</td><td>${f(p.r3m)}</td><td>${f(p.r12m)}</td></tr>`).join('')}</table><p class="meta">Closing prices to ${esc(m.nifty.asof)}. ${esc(m.source)}. Market mood only; not in the score.</p>`:'';
 return `<div class="card v5"><div><span class="vp">Caution <b>${x.score}</b><small>/100</small></span><span class="tag">${esc(x.version)}</span></div>
 <div class="call">${esc(x.verdict)}</div><div class="sn">${esc(ind.name)} · ${esc(ct.name)} · ${esc(x.score_note)}</div>
 <h4>Three drivers</h4><div class="tiles">${x.drivers.map(d=>`<div class="tile"><div class="ti">${d.icon} <span style="color:#fca5a5">${arr[d.dir]}</span></div><div class="tn">${esc(d.n)}</div><div class="tt">${esc(d.t)}</div><div class="ts">${esc(d.sub)} · ${esc(d.date)} ${sup(d.src)}</div></div>`).join('')}</div>
 <h4>Who to back / who to avoid</h4><div class="cols"><div class="col bk"><h5>✓ Back</h5><ul>${x.back.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div><div class="col av"><h5>✕ Avoid</h5><ul>${x.avoid.map((b,i)=>`<li>${esc(b)}${i==2?sup(x.avoid_src):''}</li>`).join('')}</ul></div></div><div class="fn">${esc(x.framing_note)}</div>
 <h4>Early warning</h4>${x.warnings.map(w=>`<div class="ew"><b>${esc(w.t)}:</b> ${esc(w.now)} ${sup(w.src)}<div class="meta">${esc(w.watch)}</div></div>`).join('')}
 <h4>What would change the call</h4><p style="font-size:14px">${esc(x.change)}</p>
 <details><summary>Details: sources, market, data</summary><h3>Local sources</h3><ol>${x.articles.map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> <span class="meta">${esc(a.date)}</span></li>`).join('')}</ol>
 <h3>Listed peers vs Nifty</h3>${mt}<h3>Official data behind the 71</h3><ul>${(V4[x.key]?.pack||[]).map(p=>`<li class="meta">${esc(p.split(' [')[0])}</li>`).join('')}</ul><p class="meta">AI-assisted synthesis of local news; news is unverified and can only lower a call, never raise it. Decision aid, not a substitute for credit judgment.</p></details></div>`}
function v4html(v,b){const cite=t=>esc(t).replace(/\[(\d+(?:[,\s]*\d+)*)\]/g,(m,g)=>'['+g.split(/[,\s]+/).filter(Boolean).map(i=>v.articles[+i]?`<a href="${esc(v.articles[+i].url)}" target="_blank" rel="noopener">${i}</a>`:i).join(',')+']');
 const f=x=>(x>0?'+':'')+x+'%',m=v.market,n=m.nifty;
 const rows=Object.entries(m.peers).map(([k,p])=>`<tr><td>${esc(k)}</td><td>${f(p.r1m)}</td><td>${f(p.r3m)}</td><td>${f(p.r12m)}</td></tr>`).join('');
 return `<h3>What is happening locally <span class="pill">AI read ${(b.sources_used||[]).length} local articles · unverified</span></h3><p>${cite(b.local_story)}</p>
 <h3>What it means for repayment</h3><p>${cite(b.repayment_impact||'')}</p>
 <p class="meta">News vs data: <b>${esc(b.news_direction||'')}</b>${b.news_direction_why?' — '+esc(b.news_direction_why):''} · written ${esc(v.generated_ist)}</p>
 <h3>Market signal: listed peers</h3><p>${esc(b.market_read||'')}</p><table><tr><th>Share</th><th>1M</th><th>3M</th><th>12M</th></tr><tr><td><b>Nifty 50</b></td><td>${f(n.r1m)}</td><td>${f(n.r3m)}</td><td>${f(n.r12m)}</td></tr>${rows}</table><p class="meta">Price change to ${esc(n.asof)} close. ${esc(m.source)}. Market mood only; not used in the score.</p>`}
function render(){const st=D.states[sel.st],ct=CITY[sel.ct],ind=IND[sel.ind];history.replaceState(null,'',`?state=${sel.st}&city=${sel.ct}${ind?'&ind='+ind.id:''}`);
 if(ind&&V5[sel.ct+'|'+ind.id]){$('#result').innerHTML=v5html(V5[sel.ct+'|'+ind.id],ind,ct);return}
 if(!ind){$('#result').innerHTML='<div class="card empty">Choose an industry to see the stance.</div>';return}
 const sec=D.sectors[ind.parent],e=D.calls[sel.st+'|'+ind.parent]||[null],[base,score,nat,loc,ins,rs]=e;
 const cb=B[sel.ct+'|'+ind.id],sb=B[sel.st+'|*'],br=cb||sb;let call=base;const v4=V4[sel.ct+'|'+ind.id],vb=v4&&v4.brief&&v4.brief.local_story?v4.brief:null;const nudged=vb?v4.nudged_by_news:(base=='ok'&&br&&br.o=='Worse');if(nudged)call='caution';
 const cls=call||'unknown',label=call?LBL[call]:'Not enough data';
 const reasons=(rs||[]).map(i=>D.reasons[i]);
 const al=r=>(call=='ok'||nudged)?r[1]>0:r[1]<0,ov=r=>/Brent|Repo /.test(r[0]);const lead=reasons.find(r=>r[3]=='national'&&al(r)&&!ov(r))||reasons.find(r=>al(r)&&!ov(r))||reasons.find(al)||reasons[0];
 const head=!call?`Not enough verified national data for ${sec.name} — Unknown, collect.`:`${label} for ${ind.name} in ${ct.name}${nudged?' (local news)':''}: ${lead?lead[0].split(' [')[0].replace(/^India-wide: (.)/,(m,c,i,t)=>'national '+(/^[A-Z][a-z]/.test(t.slice(i+12))?c.toLowerCase():c)).replace(/ — .*$/,''):''}`;
 const formula=ins=='local'?`Not enough local data for ${st.name}. National view: ${LBL[base]} (score ${nat}).`:score!=null?`National ${nat} × ${D.geo.weight_national} + ${st.name} local ${loc} × ${D.geo.weight_local} = ${score}. OK to lend ≥ ${D.geo.ok_at_or_above}; Avoid < ${D.geo.avoid_below}.`:'';
 const proxy=ind.mapping!='direct'?`<span class="pill proxy">proxy: parent sector — ${esc(sec.name)}</span>`:'';
 const why=reasons.slice(0,4).map(r=>`<li>${esc(r[0].split(' [')[0])} <span class="meta">${esc((r[0].match(/\[(.*)\]$/)||['',''])[1])}${r[2]?` · <a href="${esc(r[2])}" target="_blank" rel="noopener">source</a>`:''}</span></li>`).join('');
 const lt=cb?'':`<div class="note">Local brief not yet generated for ${esc(ct.name)}; state view shown.</div>`;
 const flav=br?`<p>${esc(br.f)}</p>`:`<p class="meta">${D.local_news_status?.active===false?'Local scan activates once the key is added.':'No local brief available yet for this state.'}</p>`;
 const checks=(vb&&vb.borrower_checks)||(cb&&cb.c)||sec.checks||[],change=(vb&&vb.change_the_call)||(cb&&cb.x)||[call?`Score ${score??nat}: OK to lend needs ${D.geo.ok_at_or_above}+, Avoid below ${D.geo.avoid_below}.`:'',sec.change||''].join(' ');
 const srcs=[...reasons.filter(r=>r[2]).map(r=>[r[0].split(' [')[0],r[2],'official']),...(vb?v4.articles.filter((a,i)=>(vb.sources_used||[]).includes(i)).map(a=>[a.title||a.url,a.url,'local article · '+a.date]):[]),...((!vb&&br&&br.s)||[]).map(s=>[s.title||s.url,s.url,'local news · '+s.date])];
 const drv=sec.drivers.map(d=>`<tr><td>${esc(d.t)}</td><td>${esc(d.st)}${d.r?` <span class="meta">${esc(d.r)}</span>`:''}</td><td>${esc(mon(d.d))}</td><td>${d.u?`<a href="${esc(d.u)}" target="_blank" rel="noopener">link</a>`:''}</td></tr>`).join('');
 const sig=Object.entries(st.signals).map(([k,s])=>`<tr><td>${k=='gst'?'GST collections':'Electricity demand'} Apr-to-date</td><td>${s.value>0?'+':''}${s.value}% vs India ${s.india>0?'+':''}${s.india}%</td><td>${esc(mon(s.as_of))}</td><td>${s.source_url?`<a href="${esc(s.source_url)}" target="_blank" rel="noopener">link</a>`:''}</td></tr>`).join('');
 const gn=sec.gnpa&&sec.gnpa.points&&sec.gnpa.points.length?`<h3>GNPA ratio, ${esc(sec.gnpa.fsr_category)} (RBI FSR, all banks)</h3>${spark(sec.gnpa.points,'value','GNPA')}`:'<h3>GNPA</h3><p class="meta">No matching RBI FSR category — Unknown, collect from internal MIS.</p>';
 const tr=sec.trend&&sec.trend.length>1?`<h3>Bank-credit growth trend (RBI)</h3>${spark(sec.trend.map(p=>({period:mon(p.period),yoy_pct:p.yoy_pct})),'yoy_pct','credit trend')}`:'';
 $('#result').innerHTML=`<div class="card" data-call="${cls}">
 <div class="top"><span class="badge ${cls}">${esc(label)}</span>${vb?'<span class="pill" style="background:#ecfeff;color:#0e7490">v4 test</span>':''}${score!=null||nat!=null?`<span class="score">${score??nat}<small>/100</small></span>`:''}${proxy}</div>
