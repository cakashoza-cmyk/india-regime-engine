name: Notes index (map overrides)
on:
  push:
    branches: [main]
    paths: ["data/notes/*.json", "!data/notes/index.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: notes-index, cancel-in-progress: false }
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 engine/notes_index.py
      - run: |
          git config user.name "regime-engine-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/notes/index.json; git diff --cached --quiet && exit 0
          git commit -m "notes index"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done
