name: Fetch note (on demand, one pair)
on:
  workflow_dispatch:
    inputs:
      state: { description: "State code, e.g. GJ", required: true }
      city: { description: "City id, e.g. gj_surat", required: true }
      industry: { description: "Industry id, e.g. mmf_textiles", required: true }
permissions:
  contents: write
concurrency:
  group: fetch-note-${{ inputs.state }}-${{ inputs.city }}-${{ inputs.industry }}
  cancel-in-progress: false
jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build note
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ST: ${{ inputs.state }}
          CT: ${{ inputs.city }}
          IND: ${{ inputs.industry }}
        run: python3 engine/note_v6.py "$ST" "$CT" "$IND"
      - name: Commit
        run: |
          git config user.name "regime-engine-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/notes/ data/cache/
          git diff --cached --quiet && exit 0
          git commit -m "note ${{ inputs.state }}/${{ inputs.city }}/${{ inputs.industry }}"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done
