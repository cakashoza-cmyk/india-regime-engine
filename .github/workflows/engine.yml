name: Macro Regime Engine
on:
  workflow_dispatch:
    inputs:
      force_language:
        description: "Run DeepSeek language jobs now"
        type: boolean
        default: false
  schedule:
    # IST = UTC+5:30. Mon-Fri: 10:15 (RBI), 12:45 (RBI ref rate), 16:05 (CPI/IIP + market close), 18:30 (FII/DII)
    - cron: "45 4 * * 1-5"
    - cron: "15 7 * * 1-5"
    # daily 16:05 IST: code decides whether today is a CPI/IIP/MPC/OBICUS day (release_calendar.is_release_day)
    - cron: "35 10 * * *"
    - cron: "0 13 * * 1-5"
    # 1st of month 12:00 IST (GST)
    - cron: "30 6 1 * *"
permissions:
  contents: write
concurrency:
  group: regime-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -q poppler-utils
      - run: pip install pytest openpyxl
      - run: python -m pytest -q engine/tests
      - name: Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python engine/pipeline.py ${{ inputs.force_language && '--force-language' || '' }}
      - name: Local credit view (weekly per pair; DeepSeek; capped calls)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LOCAL_NEWS_MAX_CALLS: "300"
        run: python engine/local_news.py || echo "local news scan failed (display-only, non-blocking)"
      - name: Lending radar (verdicts + accuracy gate)
        id: lending
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python engine/lending.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
      - name: Commit lending radar
        run: |
          git config user.name "regime-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lending_latest.json data/lending_state.json data/local_news.json engine/regime.db
          git diff --cached --quiet || git commit -m "lending radar $(date -u +%FT%TZ)"
      - name: Commit snapshot
        run: |
          git config user.name "regime-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          # commit only when the result changed (ignore run timestamps / ids)
          if python - <<'PY'
          import json, subprocess, sys
          strip = lambda d: {k: v for k, v in d.items() if k not in ("generated_at_ist", "run_id", "snapshot_date", "source_log", "alert")}
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/regime_latest.json"]))
          except Exception:
              sys.exit(1)
          new = json.load(open("data/regime_latest.json"))
          sys.exit(0 if json.dumps(strip(old), sort_keys=True, default=str) == json.dumps(strip(new), sort_keys=True, default=str) else 1)
          PY
          then echo "no material diff - regime snapshot not committed"; git pull --rebase -X ours origin main || true; git push; exit 0; fi
          git add data/regime_latest.json data/regime_history.json engine/regime.db
          git diff --cached --quiet || git commit -m "engine snapshot $(date -u +%FT%TZ)"
          git pull --rebase -X ours origin main || true
          git push
      - name: Accuracy gate
        if: steps.lending.outputs.rc == '2'
        run: |
          echo "::error::Accuracy check failed against the second source; last good values were kept (see Data audit)."
          exit 1
